# Follow BUILDING.md / main: Fedora MinGW cross-build, vendored Hamlib,
# AVIF/HEIC plugins and the existing NSIS installer (not a portable SFX).
name: KG-STV Windows installer
on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: 'Optional: verify an existing installer run using a freshly compiled test helper'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: kgstv-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cross-build:
    if: inputs.installer_run == ''
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    env:
      HAMLIB_COMMIT: 22406fa71f5b138d7efa21f6404f82d277d60693
      JOBS: '2'
    steps:
      - name: Install Fedora MinGW dependencies from BUILDING.md
        run: >-
          dnf install -y git cmake ninja-build make autoconf automake libtool
          gcc gcc-c++ gettext-devel python3 nasm findutils file unzip tar gzip zstd
          mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-winpthreads
          mingw64-qt6-qtbase mingw64-qt6-qtmultimedia
          mingw64-qt6-qtserialport mingw64-qt6-qtsvg mingw64-qt6-qtimageformats
          mingw64-fftw mingw64-openjpeg mingw64-libusb1 mingw64-libvorbis mingw64-nsis
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hamlib/Hamlib
          ref: ${{ env.HAMLIB_COMMIT }}
          path: hamlib-source
          persist-credentials: false
      - name: Identify the installed Fedora toolchain
        id: toolchain
        run: echo "id=$(rpm -qa | LC_ALL=C sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            third_party/hamlib-win64
            third_party/imageformats-win64
          key: windows-fedora44-${{ steps.toolchain.outputs.id }}-${{ env.HAMLIB_COMMIT }}-${{ hashFiles('tools/build-hamlib-win64.sh', 'tools/build-image-plugins-win64.sh') }}
      - name: Build the pinned, static Windows Hamlib
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: HAMLIB_SRC="$GITHUB_WORKSPACE/hamlib-source" bash tools/build-hamlib-win64.sh
      - name: Build AVIF and HEIC libraries and Qt plugins as on main
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bash tools/build-image-plugins-win64.sh
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            third_party/hamlib-win64
            third_party/imageformats-win64
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Configure and compile the KG-STV branch
        run: |
          cmake -S src -B build-mingw64 \
            -DCMAKE_TOOLCHAIN_FILE=/usr/share/mingw/toolchain-mingw64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPKG_CONFIG_EXECUTABLE=/usr/bin/x86_64-w64-mingw32-pkg-config \
            -DHAMLIB_ROOT="$GITHUB_WORKSPACE/third_party/hamlib-win64"
          cmake --build build-mingw64 -j2
      - name: Stage and verify the full Windows runtime
        run: |
          cmake --install build-mingw64 --prefix "$GITHUB_WORKSPACE/windows-stage"
          python3 tools/check-win-deps.py build-mingw64/qsstv-experimental.exe --package-dir windows-stage
          test -f windows-stage/platforms/qwindows.dll
          test -f windows-stage/multimedia/windowsmediaplugin.dll
          test -f windows-stage/imageformats/kimg_avif.dll
          test -f windows-stage/imageformats/kimg_heif.dll
      - name: Produce the existing main-branch NSIS installer
        run: |
          bash tools/package-win64.sh
          mkdir -p out-windows
          short=$(printf '%.8s' "$GITHUB_SHA")
          name="QSSTV-Experimental-10.1-kgstv-$short-win64-setup.exe"
          cp build-mingw64/QSSTV-Experimental-10.1-win64.exe "out-windows/$name"
          (cd out-windows && sha256sum "$name" > "$name.sha256")
          {
            printf 'Source commit: %s\nHamlib commit: %s\nPackaging: main BUILDING.md, Fedora 44 MinGW, NSIS x86_64 installer\n' "$GITHUB_SHA" "$HAMLIB_COMMIT"
            rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort
          } > out-windows/BUILDINFO.txt
          file "out-windows/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: QSSTV-Experimental-KGSTV-Windows-x86_64
          path: out-windows/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KGSTV-Windows-test-helper
          path: build-mingw64/kgstv/kgstv-offline.exe
          if-no-files-found: error
          retention-days: 7
  helper-build:
    if: inputs.installer_run != ''
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install the same Fedora MinGW Qt toolchain for the test helper
        run: dnf install -y git cmake make gcc-c++ mingw64-gcc-c++ mingw64-qt6-qtbase
      - uses: actions/checkout@v4
      - name: Compile only the independent offline test helper
        run: |
          cmake -S tools/kgstv -B build-windows-helper \
            -DCMAKE_TOOLCHAIN_FILE=/usr/share/mingw/toolchain-mingw64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-windows-helper --target kgstv-offline -j2
      - uses: actions/upload-artifact@v4
        with:
          name: KGSTV-Windows-test-helper
          path: build-windows-helper/kgstv-offline.exe
          if-no-files-found: error
          retention-days: 7
  windows-check:
    needs: [cross-build, helper-build]
    if: ${{ !cancelled() && (needs.cross-build.result == 'success' || needs.helper-build.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QSSTV-Experimental-KGSTV-Windows-x86_64
          path: windows-artifact
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: KGSTV-Windows-test-helper
          path: windows-helper
      - name: Extract the actual installer and verify the packaged Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem windows-artifact/*-setup.exe).FullName
          $expected = ((Get-Content "$installer.sha256") -split '\s+')[0]
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Installer checksum mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x $installer "-o$env:RUNNER_TEMP\kgstv-installer" -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $app = (Get-ChildItem "$env:RUNNER_TEMP\kgstv-installer" -Recurse -Filter qsstv-experimental.exe | Select-Object -First 1).FullName
          if (-not $app) { throw 'Application missing in installer' }
          Copy-Item windows-helper/kgstv-offline.exe (Split-Path $app)
          python tests/kgstv/test_windows_package.py $app
