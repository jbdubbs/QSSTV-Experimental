name: Experimental KG-STV core
on:
  push:
    branches: [main, 'feature/kgstv-integration']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev python3
      - name: Build native codec and offline tests
        run: cmake -S tools/kgstv -B build-kgstv -DCMAKE_BUILD_TYPE=Release && cmake --build build-kgstv -j2
      - name: Test image, text, PCM and BSR without devices
        run: ctest --test-dir build-kgstv --output-on-failure
