name: MMSSTV template importer
on:
  push:
    branches: [main, 'feature/mmsstv-template-import']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev qt6-svg-dev
      - name: Build standalone production editor and importer
        run: cmake -S tests/mmsstv -B build-mmsstv -DCMAKE_BUILD_TYPE=Release && cmake --build build-mmsstv -j2
      - name: Test conversion, batch import and actual editor dialogs
        run: ctest --test-dir build-mmsstv --output-on-failure
