# macOS (Apple Silicon arm64 + Intel x86_64) build: compiles, runs the headless file-decode test, and uploads an
# ad-hoc-signed .app (zip + dmg) for testers. Not notarized -- see BUILDING.md for the Gatekeeper step.
# CI covers build + decoding only; live audio, the mic permission prompt, the GUI and CAT need a real Mac.
# Runs only when a release is published (or manually), not on every push.
name: macOS build
on:
  release:
    types: [published]   # also fires for pre-releases
  workflow_dispatch:     # manual run from the Actions tab
permissions:
  contents: write   # attach the build to the release
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64,  runner: macos-14}          # Apple Silicon
          - {arch: x86_64, runner: macos-15-intel}    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@6 fftw openjpeg hamlib pkg-config cmake coreutils ffmpeg libvorbis vorbis-tools bash libavif
          echo "QT_PREFIX=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # AVIF (send over DRM, view received pictures): Qt has no AVIF plugin, so build KDE's kimg_avif against Homebrew's Qt
      # and libavif (which has the AOM encoder) -- the same plugin the AppImage and Windows builds ship. It is added to the
      # bundle below. KIMAGEFORMATS_TAG matches packaging/appimage/Dockerfile.
      - name: Build the AVIF image plugin
        env:
          KIMAGEFORMATS_TAG: v6.10.0
        run: |
          set -e
          git clone --depth 1 --branch "$KIMAGEFORMATS_TAG" https://invent.kde.org/frameworks/extra-cmake-modules.git ecm
          cmake -S ecm -B ecm/build -DCMAKE_INSTALL_PREFIX="$PWD/kdeprefix" -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
          cmake --install ecm/build
          git clone --depth 1 --branch "$KIMAGEFORMATS_TAG" https://invent.kde.org/frameworks/kimageformats.git kif
          cmake -S kif -B kif/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX;$PWD/kdeprefix;$(brew --prefix)" \
            -DKIMAGEFORMATS_HEIF=OFF -DBUILD_TESTING=OFF
          cmake --build kif/build --target kimg_avif -j "$(sysctl -n hw.ncpu)"
          find kif/build -name 'kimg_avif.dylib'

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Check binary architecture
        run: |
          lipo -archs build/qsstv-experimental.app/Contents/MacOS/qsstv-experimental | tee /dev/stderr | grep -qx "${{ matrix.arch }}"
          otool -l build/qsstv-experimental.app/Contents/MacOS/qsstv-experimental | grep -A4 LC_BUILD_VERSION | grep minos

      - name: Headless decode test
        env:
          QSSTV_BIN: ${{ github.workspace }}/build/qsstv-experimental.app/Contents/MacOS/qsstv-experimental
        # the test needs bash 4+ (macOS ships 3.2)
        run: |
          "$(brew --prefix)/bin/bash" tests/filedecode/run.sh

      - name: Headless encode test (#98)
        env:
          QT_QPA_PLATFORM: offscreen
        # the crash was racy: repeat, and require a complete wav (~12.5 MB) every time
        run: |
          for i in 1 2 3 4 5; do
            rm -f /tmp/tx.wav
            build/qsstv-experimental.app/Contents/MacOS/qsstv-experimental --encode tests/jb60_loopback/images/card.png --mode JB60 --wav-out /tmp/tx.wav 2>/tmp/enc.err || { echo "attempt $i failed: $?"; tail -5 /tmp/enc.err; exit 1; }
            sz=$(stat -f %z /tmp/tx.wav); echo "attempt $i: $sz bytes, $(grep -c 'Bad file' /tmp/enc.err) 'Bad file' lines"
            [ "$sz" -gt 6000000 ] || exit 1
          done

      - name: Create app icon
        run: |
          set -e
          mkdir qsstv.iconset
          I=packaging/linux/icons/qsstv-experimental
          cp $I-16.png qsstv.iconset/icon_16x16.png;     cp $I-32.png  qsstv.iconset/icon_16x16@2x.png
          cp $I-32.png qsstv.iconset/icon_32x32.png;     cp $I-64.png  qsstv.iconset/icon_32x32@2x.png
          cp $I-128.png qsstv.iconset/icon_128x128.png;  cp $I-256.png qsstv.iconset/icon_128x128@2x.png
          cp $I-256.png qsstv.iconset/icon_256x256.png;  cp $I-512.png qsstv.iconset/icon_256x256@2x.png
          iconutil -c icns qsstv.iconset -o build/qsstv-experimental.app/Contents/Resources/qsstv-experimental.icns

      - name: Bundle Qt and sign
        run: |
          set -e
          cd build
          mv qsstv-experimental.app QSSTV-Experimental.app
          mkdir -p QSSTV-Experimental.app/Contents/PlugIns/imageformats
          cp "$(find ../kif/build -name 'kimg_avif.dylib' | head -1)" QSSTV-Experimental.app/Contents/PlugIns/imageformats/
          # -executable: also pull in and re-point the plugin's own libraries (libavif, aom, ...)
          "$QT_PREFIX/bin/macdeployqt" QSSTV-Experimental.app -executable=QSSTV-Experimental.app/Contents/PlugIns/imageformats/kimg_avif.dylib
          codesign --force --deep --sign - QSSTV-Experimental.app
          codesign --verify --deep --strict QSSTV-Experimental.app
          echo "--- non-system libraries still referenced (should be none):"
          otool -L QSSTV-Experimental.app/Contents/MacOS/qsstv-experimental | grep -E "/opt/homebrew|/usr/local" || true

      - name: AVIF over DRM (#108)
        # no offscreen platform here: the bundle only carries Qt's cocoa plugin, and the runner has a desktop session
        # the bundled plugin must both write (TX) and read (RX) AVIF; a missing encoder falls back to JPEG2000, so check the extension
        run: |
          set -e
          APP="$PWD/build/QSSTV-Experimental.app/Contents/MacOS/qsstv-experimental"
          export HOME="$RUNNER_TEMP/avifhome"; mkdir -p "$HOME"
          "$APP" --encode tests/drm/card160.png --drm --drm-mode B --drm-qam 16 --drm-size 6000 --drm-encoding avif --wav-out "$RUNNER_TEMP/avif.wav"
          "$APP" --batch --drm -o "$RUNNER_TEMP/avifout" "$RUNNER_TEMP/avif.wav" | tee "$RUNNER_TEMP/avif.txt"
          ls "$RUNNER_TEMP/avifout"
          ls "$RUNNER_TEMP/avifout" | grep -q '_drm\.avif$'
          grep -q "DRM, 160x124" "$RUNNER_TEMP/avif.txt"

      - name: Package
        run: |
          set -e
          cd build
          ditto -c -k --keepParent QSSTV-Experimental.app QSSTV-Experimental-macos-${{ matrix.arch }}.zip
          # stage the app next to an /Applications shortcut so users can drag it across in the mounted disk image
          mkdir dmg-stage
          cp -R QSSTV-Experimental.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname QSSTV-Experimental -srcfolder dmg-stage -ov -format UDZO QSSTV-Experimental-macos-${{ matrix.arch }}.dmg
          shasum -a 256 QSSTV-Experimental-macos-${{ matrix.arch }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: QSSTV-Experimental-macos-${{ matrix.arch }}
          path: |
            build/QSSTV-Experimental-macos-${{ matrix.arch }}.zip
            build/QSSTV-Experimental-macos-${{ matrix.arch }}.dmg

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          cd build
          for ext in zip dmg; do cp QSSTV-Experimental-macos-${{ matrix.arch }}.$ext "QSSTV-Experimental-$TAG-macos-${{ matrix.arch }}.$ext"; done
          gh release upload "$TAG" QSSTV-Experimental-"$TAG"-macos-${{ matrix.arch }}.* --repo "$GITHUB_REPOSITORY" --clobber
