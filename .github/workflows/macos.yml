# macOS (Apple Silicon / arm64) build: compiles, runs the headless file-decode test, and uploads an
# ad-hoc-signed .app (zip + dmg) for testers. Not notarized -- see BUILDING.md for the Gatekeeper step.
# CI covers build + decoding only; live audio, the mic permission prompt, the GUI and CAT need a real Mac.
# Runs only when a release is published (or manually), not on every push.
name: macOS build
on:
  release:
    types: [published]   # also fires for pre-releases
  workflow_dispatch:     # manual run from the Actions tab
permissions:
  contents: write   # attach the build to the release
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@6 fftw openjpeg hamlib pkg-config cmake coreutils ffmpeg libvorbis vorbis-tools bash
          echo "QT_PREFIX=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Headless decode test
        env:
          QSSTV_BIN: ${{ github.workspace }}/build/qsstv.app/Contents/MacOS/qsstv
        # the test needs bash 4+ (macOS ships 3.2)
        run: |
          "$(brew --prefix)/bin/bash" tests/filedecode/run.sh

      - name: Headless encode test (#98)
        env:
          QT_QPA_PLATFORM: offscreen
        # the crash was racy: repeat, and require a complete wav (~12.5 MB) every time
        run: |
          for i in 1 2 3 4 5; do
            rm -f /tmp/tx.wav
            build/qsstv.app/Contents/MacOS/qsstv --encode tests/jb60_loopback/images/card.png --mode JB60 --wav-out /tmp/tx.wav 2>/tmp/enc.err || { echo "attempt $i failed: $?"; tail -5 /tmp/enc.err; exit 1; }
            sz=$(stat -f %z /tmp/tx.wav); echo "attempt $i: $sz bytes, $(grep -c 'Bad file' /tmp/enc.err) 'Bad file' lines"
            [ "$sz" -gt 6000000 ] || exit 1
          done

      - name: Create app icon
        run: |
          set -e
          mkdir qsstv.iconset
          for s in 16 32 64 128; do cp packaging/linux/icons/qsstv-experimental-$s.png qsstv.iconset/icon_${s}x${s}.png; done
          iconutil -c icns qsstv.iconset -o build/qsstv.app/Contents/Resources/qsstv-experimental.icns

      - name: Bundle Qt and sign
        run: |
          set -e
          cd build
          mv qsstv.app QSSTV-Experimental.app
          "$QT_PREFIX/bin/macdeployqt" QSSTV-Experimental.app
          codesign --force --deep --sign - QSSTV-Experimental.app
          codesign --verify --deep --strict QSSTV-Experimental.app
          echo "--- non-system libraries still referenced (should be none):"
          otool -L QSSTV-Experimental.app/Contents/MacOS/qsstv | grep -E "/opt/homebrew|/usr/local" || true

      - name: Package
        run: |
          set -e
          cd build
          ditto -c -k --keepParent QSSTV-Experimental.app QSSTV-Experimental-macos-arm64.zip
          # stage the app next to an /Applications shortcut so users can drag it across in the mounted disk image
          mkdir dmg-stage
          cp -R QSSTV-Experimental.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname QSSTV-Experimental -srcfolder dmg-stage -ov -format UDZO QSSTV-Experimental-macos-arm64.dmg
          shasum -a 256 QSSTV-Experimental-macos-arm64.*

      - uses: actions/upload-artifact@v4
        with:
          name: QSSTV-Experimental-macos-arm64
          path: |
            build/QSSTV-Experimental-macos-arm64.zip
            build/QSSTV-Experimental-macos-arm64.dmg

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          cd build
          for ext in zip dmg; do cp QSSTV-Experimental-macos-arm64.$ext "QSSTV-Experimental-$TAG-macos-arm64.$ext"; done
          shasum -a 256 QSSTV-Experimental-"$TAG"-macos-arm64.* > "QSSTV-Experimental-$TAG-macos-arm64.sha256"
          gh release upload "$TAG" QSSTV-Experimental-"$TAG"-macos-arm64.* --repo "$GITHUB_REPOSITORY" --clobber
